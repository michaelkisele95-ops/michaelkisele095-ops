<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXIONE — Connexion</title>
<meta name="description" content="NEXIONE — NEXI Académie. Portail de connexion unique.">
<meta name="theme-color" content="#0A0A3A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="nexi-loading-overlay" id="nexiLoadingOverlay">
  <img src="assets/nexi-mark.png" alt="" class="nexi-loading-mark">
  <div class="nexi-loading-spinner"></div>
  <div class="nexi-loading-text">Chargement…</div>
</div>
<div class="nexi-offline-banner" id="nexiOfflineBanner"></div>

<div class="login-screen">
  <div class="login-logo"><img src="assets/nexi-logo-full.png" alt="NEXI ONE — NEXI ACADEMY"></div>
  <div class="login-card">
    <h1>NEXIONE</h1>
    <p class="login-sub">NEXI ACADÉMIE — connecte-toi pour continuer.</p>

    <div class="login-error" id="loginError" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="identifiant">Identifiant</label>
        <input type="text" id="identifiant" name="identifiant" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>

    <div class="login-demo" id="loginDemoBox">
      <b>Comptes de démonstration</b> (cliquer pour préremplir) :
      <div class="row"><span>Administrateur</span><button type="button" data-demo data-id="admin" data-pwd="admin123" class="btn btn-ghost btn-sm">admin / admin123</button></div>
      <div class="row"><span>Superviseur école</span><button type="button" data-demo data-id="kasongo" data-pwd="sup123" class="btn btn-ghost btn-sm">kasongo / sup123</button></div>
      <div class="row"><span>Élève</span><button type="button" data-demo data-id="grace_m" data-pwd="grace123" class="btn btn-ghost btn-sm">grace_m / grace123</button></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/sync.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/sw-register.js"></script>
</body>
</html>
